name: Build Unsigned iOS IPA

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'ios/**'
      - 'package*.json'
      - 'index.html'
      - 'vite.config.js'
      - 'capacitor.config.json'
      - '.github/workflows/build-ios.yml'

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
          xcodebuild -version

      - name: Install dependencies
        run: npm ci

      - name: Test player logic
        run: npm test

      - name: Build web app
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build unsigned archive
        run: |
          set -o pipefail
          cd ios/App
          xcodebuild -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$PWD/build/App.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            archive 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      - name: Package as ipa
        run: |
          cd ios/App/build
          test -d App.xcarchive/Products/Applications/App.app
          mkdir -p Payload
          ditto App.xcarchive/Products/Applications/App.app Payload/App.app
          zip -r App.ipa Payload
          unzip -t App.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibePlayer-unsigned-ipa
          path: ios/App/build/App.ipa
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ios-build-log
          path: ${{ runner.temp }}/xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
